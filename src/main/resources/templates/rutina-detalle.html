<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'Detalle de Rutina - ' + ${rutina.nombre}">Detalle de Rutina</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body id="mainBody" class="container py-3" style="display:none;">
    <div th:replace="~{fragments/loader :: loader}"></div>
  

<div th:replace="~{fragments/navbarUsuario :: navbarUsuario}"></div>

  <h2 class="mb-4 text-center" th:text="${rutina.nombre}">Nombre de la rutina</h2>
  <p class="text-muted" th:text="${rutina.descripcion}">Descripción de la rutina</p>

  <hr>

  <h5>Ejercicios de la rutina</h5>
  <ul th:if="${rutinaEjercicios != null and !rutinaEjercicios.isEmpty()}">
    <li th:each="e : ${rutinaEjercicios}">
      <strong th:text="${e.ejercicioNombre}"></strong>
      <span>
        - <span th:text="${e.repeticiones} + ' reps, ' + ${e.pesoSugerido} + ' kg, ' + ${e.vueltas} + ' vueltas'"></span>
        <span th:if="${e.ejercicioDescripcion != null and !e.ejercicioDescripcion.isEmpty()}">
          | <a th:href="${e.ejercicioDescripcion}" target="_blank" class="btn btn-sm btn-outline-primary">
            <i class="bi bi-play-circle-fill"></i> Ver video
          </a>
        </span>
      </span>
    </li>
  </ul>

  <p th:if="${rutinaEjercicios == null or rutinaEjercicios.isEmpty()}" class="text-muted">
    Esta rutina no tiene ejercicios cargados.
  </p>

  <hr>

  <!-- Historial -->
  <div th:if="${usuario != null}">
    <h5>Historial de <span th:text="${usuario.nombre}"></span></h5>

    <table class="table table-sm table-bordered align-middle">
      <thead class="table-light">
        <tr>
          <th>Fecha</th>
          <th>Ejercicio</th>
          <th>Peso usado</th>
          <th>Reps realizadas</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="h : ${historial}">
          <td th:text="${h.fecha}"></td>
          <td th:text="${h.ejercicioNombre}"></td>
          <td th:text="${h.pesoUsado} + ' kg'"></td>
          <td th:text="${h.repeticionesRealizadas}"></td>
        </tr>
      </tbody>
    </table>

    <!-- Registrar nuevo historial -->
    <h6 class="mt-4">Registrar nuevo progreso</h6>
    <form th:action="@{/usuario/{dni}/rutina/{id}/historial(dni=${usuario.dni}, id=${rutina.id})}"
          method="post"
          class="row g-2">
      <div class="col-md-4">
        <select class="form-select" name="ejercicioId" required>
          <option value="">-- Seleccionar ejercicio --</option>
          <option th:each="e : ${rutinaEjercicios}"
                  th:value="${e.ejercicioId}"
                  th:text="${e.ejercicioNombre}"></option>
        </select>
      </div>

      <div class="col-md-3">
        <input type="number" step="0.5" name="pesoUsado" class="form-control" placeholder="Peso usado" required>
      </div>

      <div class="col-md-3">
        <input type="number" name="reps" class="form-control" placeholder="Reps realizadas" required>
      </div>

      <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">Guardar</button>
      </div>
    </form>
  </div>

  <!-- 🔙 Volver y salir -->
  <div class="mt-4 d-flex justify-content-between">
    <a th:href="@{/usuario/{dni}(dni=${usuario.dni})}" class="btn btn-secondary">Volver</a>
    <button id="salirBtn" class="btn btn-outline-danger">Cerrar sesión</button>
  </div>

<script type="module" th:src="@{/js/usuario.js}"></script>
<script th:src="@{/js/loader.js}"></script>
<script th:src="@{/js/navbar.js}"></script>
</body>
</html>
