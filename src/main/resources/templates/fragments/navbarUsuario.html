<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="navbarNav">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" th:href="@{/usuario/{dni}(dni=${usuario.dni})}">
        🏋️ Gimnasio - Mi Cuenta
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarUser"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" th:href="@{/usuario/{dni}(dni=${usuario.dni})}">Mis Rutinas</a>
          </li>
        </ul>

        <!-- 🔒 Info del usuario y logout -->
        <div class="d-flex align-items-center text-light">
          <span id="navUser" class="me-3 small"></span>
          <button id="navLogoutBtn" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 🔐 Script para mostrar el usuario logueado -->
  <script type="module">
    import { checkToken, logout } from "/js/auth.js";

    document.addEventListener("DOMContentLoaded", () => {
      const token = localStorage.getItem("token");
      if (!token) return;

      try {
        const payload = JSON.parse(atob(token.split(".")[1]));
        const nombre = payload.nombre || payload.sub || payload.dni || "Usuario";

        const navUser = document.getElementById("navbarNav");
        if (navUser) navUser.textContent = `👤 ${nombre} (${payload.rol})`;

        const logoutBtn = document.getElementById("navLogoutBtn");
        if (logoutBtn) logoutBtn.addEventListener("click", logout);
      } catch (e) {
        console.error("Error leyendo token:", e);
      }
    });
  </script>
</div>
</body>
</html>
