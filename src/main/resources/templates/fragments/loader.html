<!-- fragments/loader.html -->
<div th:fragment="loader">
    <div id="loader" class="loader-overlay">
      <div class="loader-content text-center">
        <div class="spinner-border text-primary mb-3" style="width: 4rem; height: 4rem;" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
        <h5 class="fw-semibold text-muted">Cargando...</h5>
      </div>
    </div>
  
    <style>
      /* Fondo semitransparente que cubre toda la pantalla */
      .loader-overlay {
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.96);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.3s ease-in-out;
      }
  
      /* Contenedor del spinner */
      .loader-content {
        animation: fadeIn 0.4s ease;
      }
  
      /* Animación de aparición suave */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </div>
