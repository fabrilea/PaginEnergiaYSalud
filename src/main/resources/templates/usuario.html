<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis Rutinas - Gimnasio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body id="mainBody" class="container py-3" style="display:none;">

  <div th:replace="~{fragments/loader :: loader}"></div>
  <div th:replace="~{fragments/navbarUsuario :: navbarUsuario}"></div>

  <h2 class="text-center mb-4">
    Bienvenido <span id="usuarioNombre" th:text="${usuario.nombre + ' ' + usuario.apellido}"></span>
  </h2>

  <h4 class="mb-3">Tus Rutinas</h4>

  <div th:if="${#lists.isEmpty(rutinas)}">
    <p class="text-muted">Aún no tienes rutinas asignadas.</p>
  </div>

  <div th:unless="${#lists.isEmpty(rutinas)}" class="list-group">
    <a th:each="r : ${rutinas}"
       th:href="@{/usuario/{dni}/rutina/{id}(dni=${usuario.dni}, id=${r.id})}"
       class="list-group-item list-group-item-action">
      <span th:text="${r.nombre}"></span>
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" th:src="@{/js/usuario.js}"></script>
  <script th:src="@{/js/loader.js}"></script>
  <script th:src="@{/js/estaLogueado.js}"></script>
</body>
</html>
