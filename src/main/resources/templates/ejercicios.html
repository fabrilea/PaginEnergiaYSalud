<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de Ejercicios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body id="mainBody" class="container py-3" style="display:none;">


<div th:replace="~{fragments/loader :: loader}"></div>

<!-- 🔒 Validación del token -->
<script type="module">
  import { checkToken, logout } from "/js/auth.js";

  document.addEventListener("DOMContentLoaded", () => {
    // Solo los ADMIN pueden acceder a esta vista
    const payload = checkToken("ADMIN");
    if (!payload) return;

    // Mostrar info del admin si querés
    const nombreSpan = document.getElementById("adminNombre");
    if (nombreSpan) nombreSpan.textContent = payload.nombre || payload.sub || "Administrador";

    const salirBtn = document.getElementById("logoutBtn");
    if (salirBtn) salirBtn.addEventListener("click", logout);
  });
</script>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<h2 class="mb-4 text-center">Gestión de Ejercicios</h2>

<!-- 🧩 Info de sesión -->
<div class="text-center mb-4">
  <h6>Sesión activa: <span id="adminNombre"></span></h6>
  <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
</div>

<!-- Formulario nuevo ejercicio -->
<form th:action="@{/admin/ejercicios}" method="post" class="row g-2 mb-3 border rounded p-3 shadow-sm">
  <div class="col-md-4">
    <input type="text" class="form-control" name="nombre" placeholder="Nombre del ejercicio" required>
  </div>
  <div class="col-md-6">
    <input type="text" class="form-control" name="descripcion" placeholder="Descripción o link a video">
  </div>
  <div class="col-md-2 d-grid">
    <button type="submit" class="btn btn-primary">Agregar</button>
  </div>
</form>

<!-- Lista de ejercicios -->
<div th:each="e : ${ejercicios}" class="card mb-2 shadow-sm">
  <div class="card-body d-flex justify-content-between align-items-center">
    <div>
      <!-- 🔗 Nombre como link -->
      <h5>
        <a th:href="${e.descripcion}" target="_blank" th:text="${e.nombre}"></a>
      </h5>
      <!-- Mostramos la URL en chiquito -->
      <p class="text-muted">
        <a th:href="${e.descripcion}" target="_blank" th:text="${e.descripcion}"></a>
      </p>
    </div>
    <form th:action="@{/admin/ejercicios/{id}/eliminar(id=${e.id})}" method="post">
      <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
    </form>
  </div>
</div>

<div th:if="${ejercicios == null or ejercicios.isEmpty()}" class="alert alert-info">
  No hay ejercicios cargados todavía.
</div>

<a th:href="@{/admin}" class="btn btn-secondary mt-3">Volver</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/loader.js}"></script>
<script type="module" th:src="@{/js/admin.js}"></script>
</body>
</html>
