<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

  <div class="card shadow-lg p-4 text-center" style="max-width: 450px;">
    <h1 class="text-danger mb-3">⚠️ Error</h1>
    <p class="fs-5 text-muted" th:text="${mensajeError}">Ha ocurrido un error inesperado.</p>
    <a href="/login" class="btn btn-primary mt-3">Volver al inicio</a>
  </div>

</body>
</html>
