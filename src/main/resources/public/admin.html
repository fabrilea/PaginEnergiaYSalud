<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de Administración</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body id="mainBody" class="container py-5" style="display:none;">
  <div th:replace="~{fragments/loader :: loader}"></div>
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <h1 class="mb-4 text-center">Panel de Administración</h1>

  <div id="adminInfo" class="text-center mb-4">
    <h5>Bienvenido, <span id="adminNombre"></span></h5>
  </div>

  <div class="row g-4 justify-content-center">
    <div class="col-12 col-md-3">
      <a th:href="@{/admin/usuarios}" class="btn btn-primary w-100 py-3">👥 Gestionar Usuarios</a>
    </div>
    <div class="col-12 col-md-3">
      <a th:href="@{/admin/rutinas}" class="btn btn-success w-100 py-3">🏋️‍♂️ Gestionar Rutinas</a>
    </div>
    <div class="col-12 col-md-3">
      <a th:href="@{/admin/ejercicios}" class="btn btn-warning w-100 py-3">📋 Ver Ejercicios</a>
    </div>
  </div>

  <div class="text-center mt-5">
    <button id="logoutBtn" class="btn btn-outline-danger px-4">Cerrar sesión</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/loader.js}"></script>
  <script type="module" th:src="@{/js/admin.js}"></script>
  <script th:src="@{/js/estaLogueado.js}"></script>
</body>

</html>
