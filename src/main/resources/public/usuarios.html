<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body id="mainBody" class="container py-3" style="display:none;">
  <div th:replace="~{fragments/loader :: loader}"></div>


<div th:replace="~{fragments/navbar :: navbar}"></div>

<h2 class="mb-4 text-center">Gestión de Usuarios</h2>

<!-- 🧑 Info Admin + Logout -->
<div class="text-center mb-4">
  <h6>Sesión: <span id="adminNombre"></span></h6>
  <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
</div>

<!-- Formulario de nuevo usuario -->
<form th:action="@{/admin/usuarios}" method="post" class="row g-2 mb-3 border rounded p-3 shadow-sm">
  <div class="col-12 col-md-2">
    <input type="text" class="form-control" name="dni" placeholder="DNI" required>
  </div>
  <div class="col-6 col-md-3">
    <input type="text" class="form-control" name="nombre" placeholder="Nombre" required>
  </div>
  <div class="col-6 col-md-3">
    <input type="text" class="form-control" name="apellido" placeholder="Apellido" required>
  </div>
  <div class="col-6 col-md-2">
    <select name="rol" class="form-select">
      <option value="USER" selected>USER</option>
      <option value="ADMIN">ADMIN</option>
    </select>
  </div>
  <div class="col-6 col-md-2">
    <input type="password" class="form-control" name="password" placeholder="Contraseña" required>
  </div>
  <div class="col-12 d-grid mt-2">
    <button type="submit" class="btn btn-primary">Agregar usuario</button>
  </div>
</form>

<!-- Lista de usuarios -->
<div th:each="u : ${usuarios}" class="card mb-3 p-3 shadow-sm">

  <div class="d-flex justify-content-between align-items-center">
    <div>
      <h5 th:text="${u.nombre + ' ' + u.apellido}"></h5>
      <p><strong>DNI:</strong> <span th:text="${u.dni}"></span></p>
      <p><strong>Rol actual:</strong> <span th:text="${u.rol != null ? u.rol : 'USER'}"></span></p>
    </div>

    <!-- Eliminar usuario -->
    <form th:action="@{/admin/usuarios/{dni}/eliminar(dni=${u.dni})}" method="post" class="m-0 eliminar-usuario">
      <button type="submit" class="btn btn-danger btn-sm">🗑️ Eliminar</button>
    </form>
  </div>

  <!-- Cambiar rol -->
  <form th:action="@{/admin/usuarios/{dni}/rol(dni=${u.dni})}" method="post" class="row g-2 align-items-center mt-2">
    <div class="col-8 col-md-10">
      <select name="nuevoRol" class="form-select">
        <option value="USER">USER</option>
        <option value="ADMIN">ADMIN</option>
      </select>
    </div>
    <div class="col-4 col-md-2 d-grid">
      <button type="submit" class="btn btn-outline-primary btn-sm">Cambiar rol</button>
    </div>
  </form>

  <!-- Cambiar contraseña -->
  <form th:action="@{/admin/usuarios/{dni}/password(dni=${u.dni})}" method="post" class="row g-2 align-items-center mt-2">
    <div class="col-8 col-md-10">
      <input type="password" class="form-control" name="nuevaPassword" placeholder="Nueva contraseña" required>
    </div>
    <div class="col-4 col-md-2 d-grid">
      <button type="submit" class="btn btn-outline-secondary btn-sm">Cambiar contraseña</button>
    </div>
  </form>

  <!-- Rutinas asignadas -->
  <hr>
  <h6>Rutinas asignadas:</h6>
  <ul class="mb-2" th:if="${u.usuarioRutinas != null}">
    <li th:each="r : ${u.usuarioRutinas}" class="d-flex justify-content-between align-items-center">
      <span th:text="${r.nombre}"></span>
      <form th:action="@{/admin/usuarios/{dni}/rutinas/{id}/eliminar(dni=${u.dni}, id=${r.id})}"
            method="post" class="m-0 quitar-rutina">
        <button type="submit" class="btn btn-sm btn-outline-danger">Quitar</button>
      </form>
    </li>
  </ul>
  <p th:if="${u.usuarioRutinas == null}" class="text-muted">Sin rutinas asignadas.</p>

  <!-- Asignar nueva rutina -->
  <div th:if="${#lists.size(u.usuarioRutinas) < 3}">
    <form th:action="@{/admin/usuarios/{dni}/rutinas(dni=${u.dni})}" method="post" class="row g-2 mt-2">
      <div class="col-9">
        <select name="rutinaId" class="form-select">
          <option th:each="r : ${rutinas}" th:value="${r.id}" th:text="${r.nombre}"></option>
        </select>
      </div>
      <div class="col-3 d-grid">
        <button type="submit" class="btn btn-success">Asignar</button>
      </div>
    </form>
  </div>
  <div th:if="${#lists.size(u.usuarioRutinas) >= 3}" class="text-danger small mt-2">
    Máximo de 3 rutinas alcanzado.
  </div>
</div>

<a th:href="@{/admin}" class="btn btn-secondary mt-3">⬅ Volver</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/loader.js}"></script>
<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/confirmacion.js}"></script>
<script th:src="@{/js/usuarios.js}"></script>
<script type="module" th:src="@{/js/admin.js}"></script>
</body>
</html>
